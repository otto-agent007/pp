packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: false
  unrs-resolver: false
virtualStoreDir: .pnpm
overrides:
  "@react-native/metro-config": 0.86.3
  react-native-worklets: ^0.10.0
  "@expo/cli>undici": ^6.28.0
  "@expo/server>undici": ^7.29.0
  "@expo/xcpretty>js-yaml": ^4.3.1
  "@istanbuljs/load-nyc-config>js-yaml": ^3.15.1
  "cosmiconfig>js-yaml": ^3.15.1
  "minimatch@3.1.5>brace-expansion": ^1.1.18
  "minimatch@9.0.9>brace-expansion": ^2.1.4
  nanoid: ^3.3.18
  postcss: ^8.5.23
  shell-quote: ^1.10.0
  tar: ^7.5.22
  "xcode>uuid": ^11.1.1
  "next>sharp": ^0.35.4
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
peerDependencyRules:
  allowedVersions:
    # tsconfck is the latest published version and still caps at typescript
    # ^5.0.0; vite-tsconfig-paths pins it, so there is nothing to upgrade to.
    # It only reads tsconfig extends chains, and the test suite that depends on
    # it passes under TypeScript 6. Recorded here rather than left as a standing
    # warning, so a genuinely new peer problem stays visible.
    "tsconfck>typescript": "6"
auditConfig:
  ignoreGhsas:
    - GHSA-vcc3-ghjq-m6fr
